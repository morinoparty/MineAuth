name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '📝 Documentation'
    labels:
      - 'document'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'test'
  - title: '⬆️ Dependencies'
    collapse-after: 3
    labels:
      - 'dependencies'
exclude-labels:
  - 'skip-changelog'
# PRタイトル先頭のgitmojiとブランチ名からラベルを付ける
autolabeler:
  - label: 'breaking'
    title:
      - '/^💥/'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
    title:
      - '/^(✨|💄|⚡️)/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/^(🐛|🚑️?)/'
  - label: 'security'
    title:
      - '/^🔒️?/'
  - label: 'document'
    files:
      - '*.md'
      - 'docs/**'
    branch:
      - '/docs{0,1}\/.+/'
    title:
      - '/^📝/'
  - label: 'refactor'
    title:
      - '/^♻️/'
  - label: 'chore'
    title:
      - '/^(🔧|🔨|👷|💚|🙈|🔥)/'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# ラベルごとのバージョンの上げ方（複数付いている場合は大きいほうが優先される）
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'security'
      - 'document'
      - 'chore'
      - 'refactor'
      - 'test'
      - 'dependencies'
  default: patch
template: |
  ## Changes

  $CHANGES
