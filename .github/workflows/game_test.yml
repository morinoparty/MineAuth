name: Game test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じプルリクエストに新しい push があれば、古い実行を取り消す（サーバーの起動は数分かかる）
concurrency:
  group: game-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  game-test:
    runs-on: ubuntu-24.04
    # Gradle のビルド（認可画面のフロントエンドを含む）と、サーバー 1 台・プレイヤー無しのテスト 2 件
    timeout-minutes: 30
    env:
      # gradle/libs.versions.toml の paper（paper-api）と同じ Minecraft のバージョン
      MINECRAFT_VERSION: "26.3"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # 認可画面（core/src/main/frontend）は Gradle の processResources で pnpm でビルドする
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        name: Install pnpm
        with:
          package_json_file: core/src/main/frontend/package.json
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: core/src/main/frontend/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: true

      # Xvfb・xdotool・xmodmap を入れ、FUKUROU_WORK_DIR を設定して Paper の JAR などのキャッシュを復元する
      - uses: morinoparty/fukurou/setup@d2834e454bd6541db83bb646465f3ef565b0675c # v2.2.1
        with:
          minecraft-version: ${{ env.MINECRAFT_VERSION }}

      # fukurou.acceptEula=true は Minecraft の EULA（https://aka.ms/MinecraftEULA）への同意を意味する
      - name: Run the game tests
        run: >-
          ./gradlew :core:gameTest
          -Pfukurou.acceptEula=true
          -Pfukurou.minecraftVersion="$MINECRAFT_VERSION"
          -Pfukurou.outDir="$RUNNER_TEMP/fukurou-out"

      # result.json とサーバーのログ。サーバーやクライアントの JAR は含まれない
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fukurou-paper-${{ env.MINECRAFT_VERSION }}
          path: ${{ runner.temp }}/fukurou-out
          retention-days: 14
