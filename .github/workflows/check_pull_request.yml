name: Check pull request

on: [ pull_request ]


permissions:
  statuses: write
  contents: read
  # @morinoparty/chlorophyll-react（GitHub Packages）の取得に必要
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set commit status as pending
        uses: myrotvorets/set-commit-status-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending
          context: Check pull request

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # 認可画面（core/src/main/frontend）は Gradle のビルド中に pnpm でビルドする
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        name: Install pnpm
        with:
          package_json_file: core/src/main/frontend/package.json
          run_install: false

      # registry-url と scope を渡すと、setup-node が //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} を
      # ユーザー単位の .npmrc に書く。pnpm はリポジトリの .npmrc にある認証情報の環境変数を展開しないため、こちらで渡す
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: core/src/main/frontend/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@morinoparty'

      # Gradle キャッシュの設定（setup-gradle を使用、より効率的）
      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: true  # PR では読み取り専用

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # plugin.yml の libraries は Paper がサーバー起動時に Maven Central のミラー (Google) から取得する。
      # ミラーへの反映は Maven Central より遅れるため、未反映のバージョンが入ると起動できなくなる
      - name: Check plugin libraries are available on Paper's Maven Central mirror
        run: |
          MIRROR=https://maven-central.storage-download.googleapis.com/maven2
          missing=0
          for coordinate in $(sed -n '/^libraries:/,/^[^- ]/p' core/build/resources/main/plugin.yml | sed -n 's/^- //p'); do
            IFS=: read -r group artifact version <<< "$coordinate"
            url="$MIRROR/${group//.//}/$artifact/$version/$artifact-$version.pom"
            if curl -sfI "$url" > /dev/null; then
              echo "OK      $coordinate"
            else
              echo "::error::$coordinate is not available on $MIRROR yet"
              missing=1
            fi
          done
          exit $missing

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@master
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: Check pull request
