name: Check pull request

on: [ pull_request ]


permissions:
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set commit status as pending
        uses: myrotvorets/set-commit-status-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending
          context: Check pull request

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用、より効率的）
      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: true  # PR では読み取り専用

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # plugin.yml の libraries は Paper がサーバー起動時に Maven Central のミラー (Google) から取得する。
      # ミラーへの反映は Maven Central より遅れるため、未反映のバージョンが入ると起動できなくなる
      - name: Check plugin libraries are available on Paper's Maven Central mirror
        run: |
          MIRROR=https://maven-central.storage-download.googleapis.com/maven2
          missing=0
          for coordinate in $(sed -n '/^libraries:/,/^[^- ]/p' core/build/resources/main/plugin.yml | sed -n 's/^- //p'); do
            IFS=: read -r group artifact version <<< "$coordinate"
            url="$MIRROR/${group//.//}/$artifact/$version/$artifact-$version.pom"
            if curl -sfI "$url" > /dev/null; then
              echo "OK      $coordinate"
            else
              echo "::error::$coordinate is not available on $MIRROR yet"
              missing=1
            fi
          done
          exit $missing

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@master
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: Check pull request
