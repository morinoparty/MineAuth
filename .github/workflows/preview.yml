name: preview.yml
on:
  pull_request:
    types: [opened, synchronize, closed]
  # master でもビルドジョブを走らせ、PR が復元する Gradle / pnpm のキャッシュを書き込む
  # （PR からのキャッシュは読み取り専用で、別ブランチの PR 同士では共有されないため）
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  id-token: write
  attestations: write

env:
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
  AWS_CLI_FILE_ENCODING: UTF-8
  AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
  S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
  S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
  PROJECT_NAME: MineAuth

jobs:
  # 共通の前処理：コミットSHAを取得
  setup:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "commit_sha=$calculatedSha" >> $GITHUB_OUTPUT

  # Gradle ビルドジョブ（docs と並列実行）
  build-gradle:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      test_total: ${{ steps.publish-test-results.outputs.total }}
      test_passed: ${{ steps.publish-test-results.outputs.passed }}
      test_skipped: ${{ steps.publish-test-results.outputs.skipped }}
      test_failed: ${{ steps.publish-test-results.outputs.failed }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # 認可画面（core/src/main/frontend）は Gradle のビルド中に pnpm でビルドする
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          package_json_file: core/src/main/frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: core/src/main/frontend/pnpm-lock.yaml

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: change plugin.yml version
        run: |
          sed -i "s/VersionPlaceholder/${{ env.COMMIT_SHORT_SHA }}/" ./gradle.properties

      # テストとビルドを 1 回の Gradle 実行にまとめる（起動・設定のコストを 2 回払わない）
      # --continue でテストが失敗しても JAR などの成果物は作り、レポートを後続のステップで集計する
      - name: Build and test with Gradle
        continue-on-error: true
        run: ./gradlew build --continue

      - name: Install Allure CLI
        if: success() || failure()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz
          echo "$PWD/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Aggregate Allure results
        if: success() || failure()
        run: |
          mkdir -p ./build/allure-results-aggregated
          # 各モジュール (core / addons) の allure-results を1箇所へ集約する。
          # 新しいモジュールにテストを追加してもここを編集せずレポートへ自動的に含まれる。
          find . -type d -path '*/build/allure-results' -not -path '*/allure-results-aggregated/*' | while read -r dir; do
            cp -a "$dir/." ./build/allure-results-aggregated/ 2>/dev/null || true
          done

      - name: Generate Allure report
        if: success() || failure()
        continue-on-error: true
        run: allure generate ./build/allure-results-aggregated -o ./build/allure-report --clean

      - name: Publish test results
        id: publish-test-results
        uses: mikepenz/action-junit-report@e08919a3b1fb83a78393dfb775a9c37f17d8eea6 # v6.0.1
        if: success() || failure()
        with:
          report_paths: './**/build/test-results/test/TEST-*.xml'

      - name: Prepare Gradle artifacts
        run: |
          mkdir -p ./gradle-artifacts/jars
          mkdir -p ./gradle-artifacts/junit
          mkdir -p ./gradle-artifacts/detekt
          mkdir -p ./gradle-artifacts/allure
          mv ./core/build/libs/core-*-all.jar ./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-core-${{ env.COMMIT_SHORT_SHA }}.jar
          # sourcesJARを除外してメインJARのみ移動
          api_jar=$(find ./api/build/libs/ -name "api-*.jar" ! -name "*-sources.jar" | head -1)
          mv "$api_jar" ./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar

          # 動的にすべてのaddonを検出してリネーム
          for addon_dir in ./addons/*/; do
            addon_name=$(basename "$addon_dir")
            jar_file=$(find "${addon_dir}build/libs/" -name "${addon_name}-*-all.jar" 2>/dev/null | head -1)
            if [ -n "$jar_file" ]; then
              mv "$jar_file" "./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-addon-${addon_name}-${{ env.COMMIT_SHORT_SHA }}.jar"
              echo "Moved addon: ${addon_name}"
            else
              echo "No JAR found for addon: ${addon_name}"
            fi
          done

          cp -r ./core/build/reports/tests/test/* ./gradle-artifacts/junit/ || echo "No JUnit reports found"
          cp -r ./build/reports/detekt/* ./gradle-artifacts/detekt/
          cp -r ./build/allure-report/* ./gradle-artifacts/allure/ || echo "No Allure reports found"

      # GitHub Attestations で署名
      - name: Attest JAR artifacts
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './gradle-artifacts/jars/*.jar'

      - name: Upload Gradle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-artifacts
          path: ./gradle-artifacts
          retention-days: 1

  # fukurou のゲームテスト（本物の Paper サーバーに shadowJar を入れて確かめる。gradle と並列実行）
  game-test:
    needs: setup
    # master への push はキャッシュを書き込むためだけに走らせるので、ゲームテストは PR と手動実行で走らせる
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    # Gradle のビルド（認可画面のフロントエンドを含む）と、サーバー 1 台・プレイヤー無しのテスト
    timeout-minutes: 30
    # PR のコードを実行するジョブなので、テスト結果の check を作る以外の権限は渡さない
    permissions:
      contents: read
      checks: write
    outputs:
      test_total: ${{ steps.publish-game-test-results.outputs.total }}
      test_passed: ${{ steps.publish-game-test-results.outputs.passed }}
      test_skipped: ${{ steps.publish-game-test-results.outputs.skipped }}
      test_failed: ${{ steps.publish-game-test-results.outputs.failed }}
    env:
      # gradle/libs.versions.toml の paper（paper-api）と同じ Minecraft のバージョン
      MINECRAFT_VERSION: "26.3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # 認可画面（core/src/main/frontend）は Gradle の processResources で pnpm でビルドする
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          package_json_file: core/src/main/frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: core/src/main/frontend/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Xvfb・xdotool・xmodmap を入れ、FUKUROU_WORK_DIR を設定して Paper の JAR などのキャッシュを復元する
      - uses: morinoparty/fukurou/setup@d2834e454bd6541db83bb646465f3ef565b0675c # v2.2.1
        with:
          minecraft-version: ${{ env.MINECRAFT_VERSION }}

      # fukurou.acceptEula=true は Minecraft の EULA（https://aka.ms/MinecraftEULA）への同意を意味する
      # ユニットテストと同じく失敗しても後続を止めず、結果はプレビューのコメントと fukurou のビューアーで示す
      - name: Run the game tests
        continue-on-error: true
        run: >-
          ./gradlew :core:gameTest
          -Pfukurou.acceptEula=true
          -Pfukurou.minecraftVersion="$MINECRAFT_VERSION"
          -Pfukurou.outDir="$RUNNER_TEMP/fukurou-out"

      - name: Publish game test results
        id: publish-game-test-results
        uses: mikepenz/action-junit-report@e08919a3b1fb83a78393dfb775a9c37f17d8eea6 # v6.0.1
        if: success() || failure()
        with:
          check_name: Game test report
          report_paths: './core/build/test-results/gameTest/TEST-*.xml'

      # result.json とサーバーのログ。サーバーやクライアントの JAR は含まれない（fukurou/ui がこの名前で集める）
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fukurou-paper-${{ env.MINECRAFT_VERSION }}
          path: ${{ runner.temp }}/fukurou-out
          retention-days: 1

  # Docs ビルドジョブ（gradle と並列実行）
  build-docs:
    needs: setup
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（Dokka 生成用）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # pnpm キャッシュの設定
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install

      # ルートの :dokkaGenerate だけを実行する（core と api を集約したもの）。
      # タスク名だけを指定すると、docs に使わない各 addon の Dokka まで生成してしまう
      - name: Generate Dokka API documentation
        run: ./gradlew :dokkaGenerate

      - name: Build Fumadocs
        working-directory: docs
        env:
          BASE_PATH: /mineauth/${{ env.COMMIT_SHORT_SHA }}/docs
        run: pnpm run build

      - name: Upload docs artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-artifacts
          path: ./docs/out
          retention-days: 1

  # S3 アップロードジョブ（JAR・Docs・レポート）
  # Dependabot が起動した pull_request では Actions secrets が渡されず
  # S3 の認証情報が空になって失敗するため、Dependabot の PR ではスキップする
  # （後続の comment ジョブも needs 経由で自動的にスキップされる）
  upload-s3:
    needs: [setup, build-gradle, build-docs, game-test]
    # master への push はキャッシュを書き込むためだけに走らせるので、プレビューはアップロードしない
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
      # 書き込み用の認証情報は PR のコードを実行するビルドジョブには渡さず、このジョブだけで使う
      AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Prepare upload directory
        run: |
          mkdir -p ./upload
          cp -r ./artifacts/gradle-artifacts/jars ./upload/ || echo "No JAR artifacts"
          cp -r ./artifacts/gradle-artifacts/junit ./upload/ || echo "No JUnit reports"
          cp -r ./artifacts/gradle-artifacts/detekt ./upload/ || echo "No Detekt reports"
          cp -r ./artifacts/gradle-artifacts/allure ./upload/ || echo "No Allure reports"
          mkdir -p ./upload/docs
          mv ./artifacts/docs-artifacts/* ./upload/docs/

      # fukurou-paper-* の成果物から 1 枚のビューアーを作る。ほかのレポートと同じ S3 の場所へ下のステップで上げるので、ここでは公開しない
      - name: Build fukurou viewer
        continue-on-error: true
        uses: morinoparty/fukurou/ui@d2834e454bd6541db83bb646465f3ef565b0675c # v2.2.1
        with:
          title: ${{ env.PROJECT_NAME }} in-game tests
          output-dir: ${{ github.workspace }}/upload/fukurou
          upload: "false"

      # rclone の最新リリースを入れる (apt の 1.60 は R2 への転送で NotImplemented が多発する)。
      # 取得したバイナリは actions のキャッシュに保存され、アクション自体の更新は Dependabot が行う
      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      # aws s3 cp はファイルごとの処理が遅く、--only-show-errors では進捗も出ないため rclone で送る。
      # rclone は単一プロセスで接続を再利用しながら高い並列数で転送し、5 秒ごとに進捗をログに出す
      - name: Upload to S3
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ env.AWS_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
        run: |
          # secret が空のまま進むと、誤ったキーにアップロードしたり PR コメントの URL が壊れたりするため止める
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (check the MORINOPARTY_CI_* organization secrets)"
              exit 1
            fi
          done

          # xargs から起動する sh でも参照できるよう export する。
          # docs の BASE_PATH (/mineauth/<sha>/docs) と揃えるため、プレフィックスは小文字の mineauth にする
          export PREFIX="mineauth/${COMMIT_SHORT_SHA}"

          # JAR・Docs・レポート・fukurou のビューアー（ある場合）をまとめて 1 プロセスで送る
          rclone copy ./upload "s3:${S3_UPLOAD_BUCKET}/${PREFIX}" \
            --transfers=32 --checkers=32 --stats=5s --stats-one-line -v

          # 公開ドメインはディレクトリの URL から index.html を自動で解決しない。
          # docs のリンクは末尾スラッシュ (trailingSlash: true) なので、各 index.html を
          # 末尾スラッシュのキーとしても置き、リンク先や直接開いた URL が 404 にならないようにする
          find ./upload/docs -name index.html -print0 \
            | xargs -0 -P 16 -I {} sh -c '
                relative="${1#./upload/docs/}"
                aws s3api put-object \
                  --bucket "$S3_UPLOAD_BUCKET" \
                  --key "$PREFIX/docs/${relative%index.html}" \
                  --body "$1" \
                  --content-type "text/html; charset=utf-8" \
                  --endpoint-url "$S3_ENDPOINT" > /dev/null
              ' _ {}

          echo "S3 upload completed"

  # コメント作成ジョブ
  comment:
    needs: [setup, build-gradle, game-test, upload-s3]
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'synchronize' }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download JAR artifacts for comment generation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gradle-artifacts
          path: ./artifacts/gradle-artifacts

      - name: Get limit time
        id: limit-time
        run: |
          limit_time=$(date -d "7 days" +%Y-%m-%d)
          echo "LIMIT_TIME=$limit_time" >> $GITHUB_ENV

      - name: Create comment file
        env:
          JAR_BASE_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/jars"
          JUNIT_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/junit/index.html"
          ALLURE_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/allure/index.html"
          DETEKT_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/detekt/detekt.html"
          DOCS_PREVIEW_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/docs/index.html"
          DOKKA_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/docs/dokka/index.html"
          FUKUROU_VIEWER_URL: "${{ env.S3_PUBLIC_URL }}/mineauth/${{ env.COMMIT_SHORT_SHA }}/fukurou/index.html"
          ATTESTATION_URL: "${{ needs.build-gradle.outputs.attestation_url }}"
          LIMIT_TIME: ${{ env.LIMIT_TIME }}
        run: |
          # バイト数を読みやすい単位に変換する (1 MiB 以上は MB、それ未満は KB)
          human_size() {
            local bytes
            bytes=$(stat -c %s "$1")
            if [ "$bytes" -ge 1048576 ]; then
              awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1048576 }'
            else
              awk -v b="$bytes" 'BEGIN { printf "%.1f KB", b / 1024 }'
            fi
          }
          JARS=./artifacts/gradle-artifacts/jars
          CORE_SIZE=$(human_size "$JARS/${{ env.PROJECT_NAME }}-core-${{ env.COMMIT_SHORT_SHA }}.jar")
          API_SIZE=$(human_size "$JARS/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar")

          # 動的にaddonの行を生成
          ADDON_ROWS=""
          for jar in ./artifacts/gradle-artifacts/jars/${{ env.PROJECT_NAME }}-addon-*.jar; do
            if [ -f "$jar" ]; then
              jar_name=$(basename "$jar")
              # addon名を抽出 (MineAuth-addon-xxx-SHA.jar -> xxx)
              addon_name=$(echo "$jar_name" | sed "s/${{ env.PROJECT_NAME }}-addon-//" | sed "s/-${{ env.COMMIT_SHORT_SHA }}.jar//")
              # 表示名を整形 (quickshop-hikari -> QuickShop Hikari)
              display_name=$(echo "$addon_name" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
              ADDON_ROWS="${ADDON_ROWS}| Addon: ${display_name} | [${jar_name}]($JAR_BASE_URL/${jar_name}) | $(human_size "$jar") |
          "
            fi
          done

          cat << EOF > comment.md
          ## 🚀 Preview of ${{ github.event.repository.name }}

          ### 📦 Preview JARs
          Available for 7 days (until $LIMIT_TIME)
          | Artifact | Download | Size |
          |----------|----------|------|
          | Core | [${{ env.PROJECT_NAME }}-core-${{ env.COMMIT_SHORT_SHA }}.jar]($JAR_BASE_URL/${{ env.PROJECT_NAME }}-core-${{ env.COMMIT_SHORT_SHA }}.jar) | $CORE_SIZE |
          | API | [${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar]($JAR_BASE_URL/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar) | $API_SIZE |
          ${ADDON_ROWS}
          > 📜 **Attestation** (SLSA provenance): [Verify on GitHub]($ATTESTATION_URL) or run \`gh attestation verify <jar-file> --owner morinoparty\`

          ### 📖 Documentation & Reports
          Available for 7 days (until $LIMIT_TIME)
          | Resource | Link |
          |----------|------|
          | 📖 Documentation | [Preview]($DOCS_PREVIEW_URL) |
          | 📖 Dokka API | [Preview]($DOKKA_URL) |
          | 🧪 Allure Report | [Report]($ALLURE_REPORT_URL) |
          | 🧪 JUnit Report | [Report]($JUNIT_REPORT_URL) |
          | 🎮 In-game Tests (fukurou) | [Viewer]($FUKUROU_VIEWER_URL) |
          | 🔍 Detekt Report | [Report]($DETEKT_REPORT_URL) |

          ### 🧪 Test Summary
          | Suite | Tests | Passed | Skipped | Failed |
          |-------|-------|--------|---------|--------|
          | Unit | ${{ needs.build-gradle.outputs.test_total }} | ${{ needs.build-gradle.outputs.test_passed }} ✅ | ${{ needs.build-gradle.outputs.test_skipped }} ⏭️ | ${{ needs.build-gradle.outputs.test_failed }} ❌ |
          | In-game (fukurou) | ${{ needs.game-test.outputs.test_total }} | ${{ needs.game-test.outputs.test_passed }} ✅ | ${{ needs.game-test.outputs.test_skipped }} ⏭️ | ${{ needs.game-test.outputs.test_failed }} ❌ |
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
